<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/steps/" />
    <title>Health OS: воркшоп</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap"
    />
    <style>
      /* Личная презентация участника: 3 вводных слайда (из слайда ведущего) + по слайду на шаг урока.
   Номер участника вшит при сборке (const N), ссылки и пароль — его. */
      :root {
        --bg: #0f1a17;
        --panel: #16241f;
        --panel2: #1b2c26;
        --line: #2a3d36;
        --fg: #e9f2ee;
        --muted: #8fa89e;
        --keep: #4ade80;
        --cut: #f87171;
        --doc: #fbbf24;
        --accent: #5eead4;
        --display: "Unbounded", "Arial Black", sans-serif;
        --body: "Onest", "Segoe UI", Arial, sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.45;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      a {
        color: var(--accent);
      }
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .slide {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        display: none;
      }
      .slide.on {
        display: block;
      }
      .slide.intro {
        overflow: hidden;
      }
      .slide.intro iframe {
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
        display: block;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 16px 40px;
      }
      .kicker {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 2px 10px;
        font-size: 13px;
        letter-spacing: 0;
        text-transform: none;
      }
      .chip.page {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      }
      .chip.bot {
        color: var(--doc);
        border-color: color-mix(in srgb, var(--doc) 40%, transparent);
      }
      .chip.fast {
        color: var(--keep);
        border-color: color-mix(in srgb, var(--keep) 40%, transparent);
      }
      h1 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(26px, 4vw, 42px);
        line-height: 1.15;
        margin: 10px 0 8px;
        letter-spacing: -0.01em;
      }
      .goal {
        color: var(--muted);
        font-size: 19px;
        max-width: 820px;
        margin: 0 0 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .block {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
      }
      .block h2 {
        font-family: var(--display);
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 10px;
      }
      .block.see {
        border-color: color-mix(in srgb, var(--keep) 50%, transparent);
      }
      .block.see h2 {
        color: var(--keep);
      }
      .block p {
        margin: 0 0 10px;
      }
      .block p:last-child {
        margin-bottom: 0;
      }
      .say {
        position: relative;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 8px 0;
        white-space: pre-wrap;
      }
      .say .copy {
        float: right;
        margin: -4px -6px 6px 12px;
      }
      .copy {
        font: 500 13px var(--body);
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .copy.done {
        background: var(--keep);
      }
      .note {
        color: var(--muted);
        font-size: 15px;
      }
      .lbl {
        font-weight: 600;
        margin: 14px 0 2px;
      }
      .lbl:first-of-type {
        margin-top: 0;
      }
      .big a {
        font-size: 19px;
        word-break: break-all;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        align-items: baseline;
      }
      .kv b {
        color: var(--muted);
        font-weight: 500;
        font-size: 15px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 5px;
      }
      pre.cmd {
        position: relative;
        background: #0a1210;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-all;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      pre.cmd .copy {
        float: right;
        margin: -4px -6px 6px 12px;
      }
      details {
        margin-top: 6px;
      }
      summary {
        cursor: pointer;
        color: var(--accent);
      }
      details.diy summary {
        font-size: 17px;
      }
      .fine {
        margin-top: 26px;
        padding-top: 14px;
        border-top: 1px dashed var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      .fine .say {
        font-size: 14px;
        border-left-color: var(--muted);
        color: var(--fg);
      }
      .fine p {
        margin: 6px 0;
      }
      ol.plain {
        margin: 0;
        padding-left: 22px;
      }
      ol.plain li {
        margin: 4px 0;
      }
      nav {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      nav button {
        font: 600 16px var(--body);
        color: var(--fg);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
      }
      nav button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      nav .where {
        flex: 1;
        min-width: 0;
        text-align: center;
        background: none;
        border: 0;
        color: var(--muted);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      nav .me {
        font-size: 14px;
        color: var(--accent);
        white-space: nowrap;
      }
      @media (max-width: 560px) {
        nav .me {
          display: none;
        }
        nav button {
          padding: 8px 12px;
        }
      }
      .menu {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 8, 0.75);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 5;
      }
      .menu.on {
        display: flex;
      }
      .menu .list {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px 14px 0 0;
        width: min(560px, 100%);
        max-height: 80vh;
        overflow-y: auto;
        padding: 10px;
      }
      .menu .list button {
        display: block;
        width: 100%;
        text-align: left;
        font: 16px var(--body);
        color: var(--fg);
        background: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .menu .list button:hover,
      .menu .list button.cur {
        background: var(--panel2);
      }
      .picker {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 16px;
      }
      .picker.on {
        display: flex;
      }
      .picker .box {
        max-width: 420px;
        text-align: center;
      }
      .picker input {
        font: 600 28px var(--body);
        width: 120px;
        text-align: center;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--fg);
        margin: 14px 0;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <nav>
      <button id="prev" aria-label="Назад">←</button>
      <button class="where" id="where"></button>
      <span class="me" id="me"></span>
      <button id="next" aria-label="Дальше">→</button>
    </nav>
    <div class="menu" id="menu"><div class="list" id="list"></div></div>
    <div class="picker" id="picker">
      <div class="box">
        <h1>Твой номер участника</h1>
        <p class="note">
          Его называет ведущий (от 2 до 15). По нему в презентации появятся твои
          ссылки и пароль.
        </p>
        <input
          id="num"
          type="number"
          min="1"
          max="15"
          inputmode="numeric"
        /><br />
        <button
          class="copy"
          id="numgo"
          style="font-size: 17px; padding: 8px 18px"
        >
          Открыть презентацию
        </button>
      </div>
    </div>

    <script>
      let N = 2; // номер участника; 0 — спросить
      const IP = "2.31.18.229";
      const GH = "https://github.com/iamdzennn/health-os-workshop";
      const SHOW = `http://${IP}:8000/show/`;
      const STEP_DIR = [
        "",
        "01-charts",
        "02-expand",
        "03-reminders",
        "04-whats-new",
        "05-sleep",
        "06-bot-answers",
        "07-bot-files",
        "08-bot-buttons",
        "09-ct",
      ];
      const DOCS = [
        "2026-09-24 скриншот приложения WISŁA, экран 1.png",
        "2026-09-24 скриншот приложения WISŁA, экран 2.png",
        "2026-08-18 анализ крови, Northbridge (английский).pdf",
        "2026-09-29 фото заключения терапевта.jpg",
      ];
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const port = () => 8600 + N,
        pw = () => `os${8600 + N}`,
        user = () => `user${N}`,
        page = () => `http://${IP}:${port()}`;
      const say = (t) =>
        `<div class="say"><button class="copy" data-copy="${esc(t)}">Копировать</button>${esc(t)}</div>`;
      const cmd = (t) =>
        `<pre class="cmd"><button class="copy" data-copy="${esc(t)}">Копировать</button>${esc(t)}</pre>`;
      const link = (href, text) =>
        `<a href="${href}" target="_blank" rel="noopener">${esc(text || href)}</a>`;
      const docLink = (f) =>
        link(`${GH}/raw/main/new-documents/${encodeURIComponent(f)}`, f);

      function pageBlock(showFile, extra) {
        return `<div class="block see"><h2>Где посмотреть результат</h2>
    <div class="kv"><b>Открой свою страницу</b><span class="big">${link(page())}</span>
    <b>Введи пароль</b><span><code>${pw()}</code></span></div>
    <p class="note" style="margin-top:10px">После каждой отправки проекта на сервер обнови страницу в браузере.</p>
    ${extra || ""}
    ${showFile ? `<p style="margin-top:10px">Как должно получиться: ${link(SHOW + showFile, "готовая страница этого шага")}</p>` : ""}
  </div>`;
      }
      function solution(n, extraTail) {
        const dir = STEP_DIR[n];
        const phrase = `Подключи готовое решение шага ${n} и залей на сервер${extraTail || "."}`;
        return `<div class="fine">
    <p><b>Если устал или не получается, переходи к следующему шагу.</b> Чтобы продолжить с готовым результатом, скажи агенту:</p>${say(phrase)}
    <p>Агент скопирует содержимое папки ${link(`${GH}/tree/main/steps/${dir}/solution`, `steps/${dir}/solution`)} в проект, заменив его файлы,
    и отправит проект на сервер. Инструкцию по отправке он прочитает в правилах проекта (AGENTS.md, раздел «Учебный сервер»).
    Твои анализы и другие данные на сервере сохранятся: агент заменит только код.</p>
    <p>Если агент не смог отправить проект на сервер, открой последний слайд «Если всё сломалось». Там объясняется, как отправить проект самому через терминал — программу, в которую вводят команды.</p>
  </div>`;
      }
      function diyBlock(want, first, qa, arch) {
        const phrase = first
          ? `${want} Это новый проект, кода ещё нет. Прежде чем что-то писать, задай мне вопросы, которые нужны, чтобы сделать это хорошо. Потом продумай архитектуру проекта и запиши её в файл architecture.md. Дальше работаем по этому файлу: код пишем, когда я его прочитаю и соглашусь.`
          : `${want} Прежде чем писать код, задай мне вопросы, которые нужны, чтобы сделать это хорошо. Потом допиши устройство этой части в файл architecture.md и покажи мне. Код пишем по этому файлу, когда я соглашусь.`;
        return `<details class="block diy" style="margin-top:22px"><summary><b>Как сделать такое в своём проекте, без заготовки</b> — раскрыть</summary>
    <p style="margin-top:12px"><b>1. Скажи агенту, что хочешь, и попроси сначала спросить тебя:</b></p>${say(phrase)}
    <p style="margin-top:12px"><b>2. Ответь на его вопросы.</b> Скорее всего, он спросит примерно это, а ответить можно так:</p>
    <ul class="plain" style="padding-left:20px;margin:0">${qa.map(([q, a]) => `<li style="margin:6px 0">Вопрос: «${q}» Ответ: ${a}</li>`).join("")}</ul>
    <p style="margin-top:12px"><b>3. Прочитай, что агент записал в architecture.md.</b> Там должно появиться:</p>
    <ul class="plain" style="padding-left:20px;margin:0">${arch.map((x) => `<li style="margin:6px 0">${x}</li>`).join("")}</ul>
    <p style="margin-top:12px"><b>4. Поправь файл, если что-то не так, и попроси писать код по нему.</b></p>
    <details style="margin-top:12px"><summary>Почему так: общий подход ведущего, одинаковый для всех шагов</summary>
      <ol class="plain" style="margin-top:8px">
        <li style="margin:6px 0">Опиши агенту словами, что хочешь получить, — так, как объяснил бы человеку. Знать, как это устроено внутри, не нужно.</li>
        <li style="margin:6px 0">Попроси агента сначала задать вопросы. Он спросит о том, о чём ты не подумал.</li>
        <li style="margin:6px 0">Попроси агента записать устройство — архитектуру — в файл в проекте. Без такого файла каждая следующая просьба строится наугад, и через несколько дней в проекте хаос.</li>
        <li style="margin:6px 0">Работай по этому файлу. В новой сессии агент прочитает его и продолжит с того же места.</li>
      </ol>
      <p>В учебном проекте эта работа уже проделана: правила в AGENTS.md и описания в папках шагов — это то, что получилось у ведущего.</p>
    </details></details>`;
      }
      function stepSlide(s) {
        const dir = STEP_DIR[s.n];
        return `<div class="wrap">
    <div class="kicker">Шаг ${s.n} из 9 <span class="chip ${s.kind}">${s.kindText}</span></div>
    <h1>${s.title}</h1>
    <p class="goal">${s.goal}</p>
    <div class="grid">
      <div class="col">
        ${s.prep ? `<div class="block"><h2>Сначала создай своего бота</h2>${typeof s.prep === "function" ? s.prep() : s.prep}</div>` : ""}
        <div class="block"><h2>Что нужно сделать</h2>
          <div class="lbl">1. Скажи агенту простыми словами, что хочешь получить</div>
          ${say(s.naive)}
          <p class="note">${s.naiveNote}</p>
          <div class="lbl">2. Проверь результат и проси по одному улучшению</div>
          ${s.iterate.map(say).join("")}
          <div class="lbl">3. Если хочешь сделать всё сразу, попроси агента прочитать готовое описание требований</div>
          ${say(s.spec)}
          <p class="note">Файл ${link(`${GH}/blob/main/steps/${dir}/spec.md`, `steps/${dir}/spec.md`)} — это подробное описание того, что должно получиться. Ведущий собрал его за десятки таких улучшений. Файл уже лежит в твоём проекте, агент прочитает его сам.
          Все фразы этого шага, в том числе не поместившиеся на слайд, собраны в файле ${link(`${GH}/blob/main/steps/${dir}/prompts.md`, "prompts.md")}.</p>
        </div>
      </div>
      <div class="col">
        ${s.see}
        ${s.files ? `<div class="block"><h2>Какие файлы использовать</h2>${s.files}</div>` : ""}
        ${s.about ? s.about() : ""}
      </div>
    </div>
    ${s.diy ? diyBlock(s.diy.want, false, s.diy.qa, s.diy.arch) : ""}
    ${solution(s.n, s.solTail)}
  </div>`;
      }

      const STEPS = [
        {
          n: 1,
          diy: {
            want: "Хочу на странице графики по каждому показателю анализов: как он менялся по датам и где норма.",
            qa: [
              [
                "Рисовать графики готовой библиотекой или писать с нуля?",
                "Готовой библиотекой, писать с нуля не нужно.",
              ],
              [
                "Какую норму показывать: с бланка каждой лаборатории или одну на показатель?",
                "Одну на показатель, из списка показателей.",
              ],
              [
                "Как группировать графики?",
                "По темам, как на бланке: липиды, печень, витамины.",
              ],
            ],
            arch: [
              "Что графики берут данные из файла со всеми замерами, а не из PDF.",
              "Что норма для полосы и цвета точек берётся из списка показателей.",
              "Правило шкалы: шкала подгоняется под значения и не бывает слишком узкой, чтобы разница в 3 единицы не выглядела обвалом.",
            ],
          },
          kind: "page",
          kindText: "страница",
          title: "Посмотри, как менялись анализы",
          goal: "Сейчас раздел «Анализы» показывает таблицы с цифрами. Добавь графики, чтобы видеть, как менялся каждый показатель и какие значения выходили за пределы нормы.",
          naive:
            "Добавь в раздел «Анализы» графики: как менялся каждый показатель по годам. Залей на сервер.",
          naiveNote:
            "Открой страницу и проверь графики. После такой просьбы часто не видно нормы, все точки имеют один цвет, шкала ферритина доходит до 400 при значениях до 74, а разница между 148 и 151 у гемоглобина выглядит как обвал.",
          iterate: [
            "Покажи на каждом графике норму светло-зелёной полосой. Точки раскрась: зелёные — в норме, красные — выше нормы, оранжевые — ниже. Залей на сервер.",
            "Ось подбирается плохо: у ферритина она до 400, а значения до 74, линия плоская. Подгони ось под значения; границу нормы показывай на оси, только если она рядом со значениями. Залей на сервер.",
            "Теперь у гемоглобина 148 и 151 выглядят как обвал. Сделай минимальный размах оси, чтобы маленькая разница выглядела маленькой. Залей на сервер.",
          ],
          spec: "Сделай графики в разделе «Анализы» строго по требованиям в steps/01-charts/spec.md. Потом залей на сервер.",
          see: () =>
